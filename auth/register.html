<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký - Medilate OPS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 py-8">
    <div class="w-full max-w-2xl">
        <div class="bg-white rounded-2xl shadow-2xl p-8">
            <!-- Logo/Header -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 rounded-xl mb-4">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
                    </svg>
                </div>
                <h1 class="text-3xl font-bold text-gray-900">Tạo Tài Khoản</h1>
                <p class="text-gray-600 mt-2">Tham gia Medilate OPS</p>
            </div>

            <!-- Register Form -->
            <form class="space-y-6" onsubmit="event.preventDefault(); window.location.href='login.html';">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Họ -->
                    <div>
                        <label for="ho" class="block text-sm font-medium text-gray-700 mb-2">Họ <span class="text-red-500">*</span></label>
                        <input 
                            type="text" 
                            id="ho" 
                            name="ho"
                            placeholder="Ví dụ: Nguyễn"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition"
                            required
                        >
                    </div>

                    <!-- Tên -->
                    <div>
                        <label for="ten" class="block text-sm font-medium text-gray-700 mb-2">Tên <span class="text-red-500">*</span></label>
                        <input 
                            type="text" 
                            id="ten" 
                            name="ten"
                            placeholder="Ví dụ: Văn A"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition"
                            required
                        >
                    </div>
                </div>

                <!-- Email -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email <span class="text-red-500">*</span></label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email"
                        placeholder="email@example.com"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition"
                        required
                    >
                </div>

                <!-- Phone -->
                <div>
                    <label for="phone" class="block text-sm font-medium text-gray-700 mb-2">Số điện thoại <span class="text-red-500">*</span></label>
                    <input 
                        type="tel" 
                        id="phone" 
                        name="phone"
                        placeholder="Ví dụ: 0901234567"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition"
                        required
                    >
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Password -->
                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Mật khẩu <span class="text-red-500">*</span></label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password"
                            placeholder="••••••••"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition"
                            required
                        >
                    </div>

                    <!-- Confirm Password -->
                    <div>
                        <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-2">Xác nhận mật khẩu <span class="text-red-500">*</span></label>
                        <input 
                            type="password" 
                            id="confirmPassword" 
                            name="confirmPassword"
                            placeholder="••••••••"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition"
                            required
                        >
                    </div>
                </div>

                <!-- Role -->
                <div>
                    <label for="role" class="block text-sm font-medium text-gray-700 mb-2">Vai trò <span class="text-red-500">*</span></label>
                    <select 
                        id="role"
                        name="role"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition bg-white"
                        required
                    >
                        <option value="">Chọn vai trò</option>
                        <option value="reception">Nhân viên tiếp nhận</option>
                        <option value="dispatch">Nhân viên điều phối</option>
                        <option value="doctor">Bác sĩ</option>
                        <option value="cashier">Thu ngân</option>
                        <option value="facility">Quản lý cơ sở</option>
                        <option value="executive">Ban điều hành</option>
                    </select>
                </div>

                <!-- Facility -->
                <div>
                    <label for="facility" class="block text-sm font-medium text-gray-700 mb-2">Cơ sở <span class="text-red-500">*</span></label>
                    <select 
                        id="facility"
                        name="facility"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition bg-white"
                        required
                    >
                        <option value="">Chọn cơ sở</option>
                        <option value="facility-01">Phòng khám Trung tâm</option>
                        <option value="facility-02">Phòng khám Khu vực Bắc</option>
                        <option value="facility-03">Phòng khám Khu vực Nam</option>
                        <option value="facility-04">Phòng khám Khu vực Đông</option>
                    </select>
                </div>

                <!-- Terms -->
                <div class="flex items-start">
                    <input type="checkbox" id="terms" class="mt-1 w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500" required>
                    <label for="terms" class="ml-2 text-sm text-gray-600">
                        Tôi đồng ý với <a href="#" class="text-blue-600 hover:text-blue-700">Điều khoản dịch vụ</a> và <a href="#" class="text-blue-600 hover:text-blue-700">Chính sách bảo mật</a>
                    </label>
                </div>

                <!-- Submit Button -->
                <button 
                    type="submit"
                    class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition shadow-lg hover:shadow-xl"
                >
                    Tạo Tài Khoản
                </button>
            </form>

            <!-- Login Link -->
            <div class="mt-6 text-center">
                <p class="text-sm text-gray-600">
                    Đã có tài khoản? 
                    <a href="login.html" class="text-blue-600 hover:text-blue-700 font-medium">Đăng nhập</a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
